<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0D0F14" />
    <meta
      name="description"
      content="ZORO — a private, offline AI agent. Interactive on-device prototype."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://huggingface.co; font-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>ZORO · Your intelligence. Your device.</title>
    <style>
      /* 01 — Design tokens and the phone shell */
      :root {
        color-scheme: dark;
        --bg: #0d0f14;
        --surface: #171a21;
        --raised: #1d212c;
        --border: #232733;
        --accent: #4f6bff;
        --text: #e8eaf0;
        --muted: #8b92a5;
        --green: #8bdfb2;
        --red: #ffa1ad;
        --amber: #e8bd77;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans Bengali",
          Arial,
          sans-serif;
        font-size: 16px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #090b10;
        color: var(--text);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
        border: 0;
        background: none;
        min-height: 44px;
        transition:
          background 0.2s,
          transform 0.2s,
          border-color 0.2s;
      }
      button:active {
        transform: scale(0.97);
      }
      button:disabled {
        cursor: default;
        opacity: 0.4;
      }
      button:hover:not(:disabled) {
        background-color: #ffffff0a;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 2px solid #91a1ff;
        outline-offset: 3px;
      }
      svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 27px;
        letter-spacing: -1px;
        line-height: 1.2;
        font-weight: 600;
      }
      h2 {
        font-size: 22px;
        letter-spacing: -0.6px;
      }
      h3 {
        font-size: 15px;
        font-weight: 600;
      }
      p {
        line-height: 1.6;
      }
      small {
        font-size: 12px;
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
      }
      #phone {
        position: relative;
        isolation: isolate;
        width: 100%;
        height: 100dvh;
        height: var(--vh, 100dvh);
        min-height: 0;
        background: var(--bg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #phone.keyboard-open .suggestions {
        display: none;
      }
      .model-card h3 {
        overflow-wrap: anywhere;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .statusbar {
        height: 43px;
        flex-shrink: 0;
        padding: 13px 26px 5px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .status-right {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .status-right svg {
        width: 15px;
        height: 15px;
      }
      .battery {
        width: 22px;
        height: 10px;
        border: 1px solid #afb5c5;
        border-radius: 3px;
        padding: 1px;
        position: relative;
      }
      .battery:before {
        content: "";
        display: block;
        width: 80%;
        height: 100%;
        background: #c9cdd7;
        border-radius: 1px;
      }
      .battery:after {
        content: "";
        position: absolute;
        right: -3px;
        top: 2px;
        width: 2px;
        height: 4px;
        background: #afb5c5;
      }
      .home-indicator {
        height: 16px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
      }
      .home-indicator:after {
        content: "";
        width: 104px;
        height: 4px;
        border-radius: 4px;
        background: #e8eaf04a;
      }
      .app-top {
        padding: 9px 15px 12px;
        border-bottom: 1px solid #ffffff05;
      }
      .toprow {
        display: flex;
        align-items: center;
        gap: 1px;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        border-radius: 12px;
        color: #a7aebe;
      }
      .icon-btn:hover {
        color: var(--text);
      }
      .model-chip {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        flex: 1;
        min-width: 0;
        font-size: 12px;
        font-weight: 500;
      }
      .model-chip span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 157px;
      }
      .model-chip svg {
        width: 13px;
        height: 13px;
        color: var(--muted);
      }
      .offline {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        letter-spacing: 0.3px;
        color: #99b8a8;
        margin-top: 5px;
      }
      .offline svg {
        width: 12px;
        height: 12px;
      }
      .offline .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--green);
      }
      #main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .screen {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        animation: enter 0.2s ease-out;
      }
      .screen-head {
        display: flex;
        align-items: center;
        padding: 9px 13px 13px;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .screen-head h2 {
        font-size: 20px;
        flex: 1;
      }
      .screen-head .icon-btn {
        margin-left: -4px;
      }
      .scroll {
        overflow-y: auto;
        overscroll-behavior: contain;
        flex: 1;
        min-height: 0;
        padding: 22px 20px;
        scrollbar-width: thin;
        scrollbar-color: #303645 transparent;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .between {
        justify-content: space-between;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .divider {
        height: 1px;
        background: var(--border);
        margin: 20px 0;
      }
      .primary,
      .secondary,
      .danger {
        border-radius: 13px;
        padding: 12px 18px;
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }
      .primary {
        background: var(--accent);
        color: white;
      }
      .primary:hover:not(:disabled) {
        background: #627bff;
      }
      .secondary {
        background: var(--raised);
        border: 1px solid var(--border);
      }
      .danger {
        background: #ff637315;
        color: var(--red);
        border: 1px solid #ff637326;
      }
      .wide {
        width: 100%;
      }
      .link {
        font-size: 12px;
        color: #a8b5ff;
        padding: 8px 4px;
      }
      .card {
        padding: 17px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 17px;
      }
      .section-title {
        margin: 27px 0 12px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.8px;
        color: var(--muted);
        font-weight: 600;
      }
      .section-title:first-child {
        margin-top: 0;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 7px;
        border-radius: 6px;
        background: #8bdfb211;
        color: var(--green);
        font-size: 10px;
        white-space: nowrap;
      }
      .pill.amber {
        color: var(--amber);
        background: #e8bd7710;
      }
      .pill.red {
        color: var(--red);
        background: #ffa1ad10;
      }
      .field {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 13px 14px;
        min-height: 46px;
        color: var(--text);
        outline: none;
        font-size: 14px;
      }
      .field::placeholder {
        color: #70788c;
      }
      .field:focus {
        border-color: var(--accent);
      }
      textarea.field {
        resize: vertical;
        line-height: 1.6;
      }
      select.field {
        appearance: auto;
      }
      .empty {
        padding: 50px 10px;
        text-align: center;
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 14px;
      }
      .empty > svg {
        width: 34px;
        height: 34px;
        color: #68738e;
      }
      .empty p {
        font-size: 13px;
        color: var(--muted);
      }
      /* 02 — Chat, orb and agent action cards */
      #chat-scroll {
        padding: 0 20px 20px;
      }
      .welcome {
        padding-top: 39px;
        text-align: center;
      }
      .avatar {
        position: relative;
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border: 1px solid #6d81ff55;
        border-radius: 25px;
        background: linear-gradient(145deg, #28336c, #161c39 65%);
        box-shadow:
          0 0 45px #4f6bff17,
          inset 0 1px 1px #ffffff12;
        transform: rotate(-7deg);
      }
      .avatar svg {
        width: 35px;
        height: 35px;
        stroke: #b0bdff;
        stroke-width: 1.8;
        transform: rotate(7deg);
      }
      .avatar:after {
        content: "";
        width: 5px;
        height: 5px;
        background: #a2b0ff;
        border-radius: 50%;
        position: absolute;
        right: -8px;
        top: 5px;
        box-shadow: 0 0 12px #667eff;
      }
      .wordmark {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 4px;
        color: #b8c3ff;
        margin-bottom: 12px;
      }
      .welcome h1 {
        max-width: 275px;
        margin: auto;
      }
      .welcome p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 13px;
      }
      .suggestions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 30px;
        text-align: left;
      }
      .suggestion {
        min-height: 104px;
        text-align: left;
        padding: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 13px;
        font-size: 12px;
        line-height: 1.5;
      }
      .suggestion svg {
        width: 18px;
        height: 18px;
        color: #99aaff;
      }
      .suggestion:nth-child(2) svg {
        color: #c1abeb;
      }
      .suggestion:nth-child(3) svg {
        color: #e5bd8a;
      }
      .suggestion:nth-child(4) svg {
        color: #91cbbd;
      }
      .local-caption {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 24px;
        color: #646d81;
        font-size: 10px;
      }
      .local-caption svg {
        width: 12px;
        height: 12px;
      }
      .composer-zone {
        padding: 12px 16px 4px;
        padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(transparent, var(--bg) 18%);
        flex-shrink: 0;
      }
      .composer {
        padding: 7px 5px;
        display: flex;
        align-items: flex-end;
        background: var(--surface);
        border: 1px solid #2b303d;
        border-radius: 19px;
        gap: 0;
      }
      .composer textarea {
        width: 100%;
        min-height: 42px;
        max-height: 115px;
        resize: none;
        border: 0;
        outline: none;
        background: transparent;
        padding: 12px 5px;
        color: var(--text);
        font-size: 13px;
        line-height: 19px;
        scrollbar-width: thin;
      }
      .composer textarea::placeholder {
        color: #747d92;
      }
      .composer .icon-btn {
        width: 35px;
        min-width: 35px;
        height: 42px;
      }
      .composer .send {
        width: 35px;
        min-width: 35px;
        height: 35px;
        min-height: 35px;
        margin: 3px 3px 4px 0;
        border-radius: 11px;
        background: var(--accent);
        color: #fff;
      }
      .composer .send svg {
        width: 18px;
        height: 18px;
      }
      .composer-foot {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        color: #6c7589;
        font-size: 9px;
        margin-top: 10px;
        height: 13px;
      }
      .composer-foot svg {
        width: 10px;
        height: 10px;
      }
      .message {
        margin-top: 22px;
        animation: enter 0.2s ease-out;
      }
      .message.user {
        display: flex;
        justify-content: flex-end;
      }
      .bubble {
        padding: 13px 15px;
        font-size: 14px;
        line-height: 1.7;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .user .bubble {
        max-width: 88%;
        background: #4059dd;
        border-radius: 17px 17px 4px 17px;
      }
      .assistant .bubble {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 4px 17px 17px 17px;
      }
      .msg-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        letter-spacing: 1.4px;
        margin: 0 0 9px;
        color: #a8b7ff;
      }
      .msg-label svg {
        width: 16px;
        height: 16px;
      }
      .msg-label span {
        color: #727c93;
        font-size: 9px;
        letter-spacing: 0.2px;
      }
      .msg-tools {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
      }
      .msg-tools button {
        min-height: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        font-size: 10px;
        padding: 5px 9px;
        border-radius: 8px;
      }
      .msg-tools svg {
        width: 13px;
        height: 13px;
      }
      .cursor {
        display: inline-block;
        width: 2px;
        height: 16px;
        background: #9dacf9;
        vertical-align: middle;
        margin-left: 3px;
        animation: blink 1s infinite;
      }
      .typing {
        display: flex;
        gap: 4px;
        height: 22px;
        align-items: center;
      }
      .typing i {
        height: 5px;
        width: 5px;
        background: #a0abcb;
        border-radius: 50%;
        animation: blink 1s infinite;
      }
      .typing i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing i:nth-child(3) {
        animation-delay: 0.3s;
      }
      .action-card {
        margin-top: 11px;
        padding: 15px;
        border: 1px solid #4f6bff40;
        background: linear-gradient(130deg, #1b2340, #171b29);
        border-radius: 14px;
      }
      .tool-icon {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        background: #4f6bff20;
        display: grid;
        place-items: center;
        color: #a8b7ff;
        flex-shrink: 0;
      }
      .action-card h3 {
        font-size: 13px;
        line-height: 1.4;
      }
      .action-card p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 7px;
      }
      .action-card .buttons {
        display: flex;
        gap: 8px;
        margin-top: 13px;
      }
      .action-card .buttons button {
        flex: 1;
        padding: 10px;
      }
      .action-status {
        margin-top: 12px;
        font-size: 12px;
        color: var(--green);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .countdown {
        font-variant-numeric: tabular-nums;
        font-size: 26px;
        letter-spacing: 1px;
        margin-top: 10px;
      }
      .attachment {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: #b3c0ff;
        padding: 0 8px 9px;
      }
      .attachment button {
        margin-left: auto;
        min-height: 25px;
        height: 25px;
      }
      /* 03 — Sheets, navigation and form controls */
      #overlay:empty {
        display: none;
      }
      #overlay {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #0008;
        backdrop-filter: blur(4px);
        display: flex;
        align-items: flex-end;
        animation: fade 0.2s;
      }
      .sheet {
        width: 100%;
        max-height: 88%;
        background: #12151c;
        border: 1px solid #2b303c;
        border-bottom: 0;
        border-radius: 24px 24px 0 0;
        padding: 0 20px 23px;
        display: flex;
        flex-direction: column;
        animation: up 0.23s ease-out;
        box-shadow: 0 -10px 70px #0003;
      }
      .handle {
        width: 32px;
        height: 4px;
        background: #3e4556;
        border-radius: 4px;
        margin: 10px auto 12px;
        flex-shrink: 0;
      }
      .sheet-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
        flex-shrink: 0;
      }
      .sheet-head h2 {
        font-size: 20px;
      }
      .sheet-head .icon-btn {
        margin-right: -8px;
      }
      .sheet-content {
        overflow: auto;
        min-height: 0;
        scrollbar-width: thin;
      }
      .sheet-menu {
        width: 100%;
        display: flex;
        align-items: center;
        text-align: left;
        gap: 14px;
        padding: 12px 5px;
        border-radius: 12px;
      }
      .sheet-menu .tool-icon {
        background: var(--raised);
        color: #a7b1ca;
      }
      .sheet-menu strong {
        display: block;
        font-size: 14px;
        font-weight: 500;
      }
      .sheet-menu small {
        display: block;
        margin-top: 4px;
        font-size: 11px;
      }
      .sheet-menu > svg {
        width: 15px;
        color: var(--muted);
      }
      .device-info {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 16px;
      }
      .device-info svg {
        width: 15px;
        height: 15px;
      }
      .model-card {
        border-radius: 15px;
        padding: 14px;
        margin-bottom: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
      }
      .model-card.active {
        border-color: #4f6bff75;
        background: #4f6bff0c;
      }
      .model-card h3 {
        font-size: 13px;
      }
      .model-card .meta {
        font-size: 10px;
        color: var(--muted);
        margin-top: 6px;
        line-height: 1.5;
      }
      .model-card .row {
        gap: 7px;
      }
      .model-card .model-bottom {
        margin-top: 12px;
      }
      .model-card .primary,
      .model-card .secondary {
        font-size: 11px;
        padding: 6px 12px;
        min-height: 36px;
      }
      .model-card .selected {
        color: #a8b5ff;
        font-size: 11px;
        display: flex;
        gap: 5px;
        align-items: center;
        min-height: 36px;
      }
      .model-card .selected svg {
        width: 15px;
      }
      .progress-track {
        height: 5px;
        overflow: hidden;
        background: #2b3140;
        border-radius: 5px;
        margin-top: 13px;
      }
      .progress-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 5px;
        transition: width 0.4s linear;
      }
      .download-meta {
        font-size: 11px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
        margin: 9px 0;
      }
      .download-card {
        margin-bottom: 12px;
      }
      .download-card h3 {
        overflow-wrap: anywhere;
        line-height: 1.5;
      }
      .download-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .download-actions button {
        font-size: 11px;
        min-height: 38px;
        padding: 8px 13px;
      }
      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 13px;
        min-height: 56px;

      // Only public model metadata is requested. No credentials, chats or model bytes.
      async function hfJSON(path) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 20000);
        try {
          const response = await fetch(
            `https://huggingface.co/api/models${path}`,
            {
              signal: controller.signal,
              credentials: "omit",
              referrerPolicy: "no-referrer",
            },
          );
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return await response.json();
        } finally {
          clearTimeout(timeout);
        }
      }
      async function searchModels() {
        const q = state.hfQuery.trim();
        const request = ++state.hfRequest;
        state.hfSearched = !!q;
        state.hfLoading = !!q;
        state.hfError = false;
        state.hfResults = [];
        updateResults();
        if (!q) return;
        try {
          const results = await hfJSON(
            `?search=${encodeURIComponent(q)}&filter=gguf&sort=downloads&limit=20`,
          );
          if (!Array.isArray(results)) throw new Error("Invalid model list");
          if (request !== state.hfRequest) return;
          state.hfResults = results.filter(
            (r) => r && typeof r.id === "string",
          );
        } catch (error) {
          if (request !== state.hfRequest) return;
          state.hfError = true;
        } finally {
          if (request === state.hfRequest) {
            state.hfLoading = false;
            updateResults();
          }
        }

        const repo = state.hfResults[index]?.id;

        state.filesLoading = true;
        state.filesError = false;

          const data = await hfJSON(
            `/${repo.split("/").map(encodeURIComponent).join("/")}?blobs=true`,
          );
          if (!Array.isArray(data.siblings))
            throw new Error("Invalid file list");
          if (request !== state.fileRequest) return;
          state.files = data.siblings
            .filter(
              (f) =>
                typeof f.rfilename === "string" && /\.gguf$/i.test(f.rfilename),
            )
            .map((f) => {
              const bytes = f.size ?? f.lfs?.size;
              const size =
                Number.isFinite(bytes) && bytes > 0 ? bytes / 1e9 : null;
              return {
                id: `hf-${encodeURIComponent(repo + "/" + f.rfilename)}`,
                name: f.rfilename,
                repo,
                size,
                quant:
                  f.rfilename
                    .match(/(?:IQ|Q)\d[A-Z0-9_]*/i)?.[0]
                    .toUpperCase() || "GGUF",
                fit: size > 3.5 ? "large" : size > 1.8 ? "slow" : "good",
                downloaded: false,
              };
            });
        } catch (error) {
          if (request !== state.fileRequest) return;
          state.filesError = true;
        } finally {
          if (request === state.fileRequest) {
            state.filesLoading = false;
            if (state.screen === "files" && !state.locked) render();

            if (state.screen === "activity" && !state.locked) render();
          }
          document
            .querySelectorAll(`[data-countdown="${x.id}"]`)
            .forEach((el) => (el.textContent = formatTime(x.ends - now)));
        }
        for (const a of state.alarms) {
          if (!a.fired && now >= a.at) {
            a.fired = true;
            if (!state.locked) toast(`${t("Alarm")} · ${a.time}`);
            if (state.screen === "activity" && !state.locked) render();
          }
        }
        updateDownloads();
      }
      /* 11 — Event delegation: no inline handlers, no HTML from user input */
      document.addEventListener("click", async (e) => {
        const b = e.target.closest("[data-action]");
        if (!b) return;
        const a = b.dataset.action,
          id = b.dataset.id;
        if (state.locked && a !== "unlock") return;
        switch (a) {
          case "onboard-next":
            if (state.onboard < 2) {
              state.onboard++;
              render();
            } else {
              state.onboardDone = true;
              persist();
              render();
              openSheet("models");
            }
            break;
          case "onboard-skip":
            state.onboardDone = true;
            persist();
            render();
            break;
          case "slide":
            state.onboard = Number(b.dataset.index);
            render();
            break;
          case "back":
            navigate(state.screen === "files" ? "hf" : "chat");
            break;
          case "settings":
          case "notes":
          case "activity":
          case "downloads":
          case "hf":
            navigate(a);
            break;
          case "models":
            openSheet("models");
            break;
          case "plus":
            openSheet("plus");
            break;
          case "attach":
            openSheet("attach");
            break;
          case "attach-file":
            state.attachment = b.dataset.name;
            closeOverlay(false);
            render();
            toast("File attached (simulated)");
            break;
          case "detach":
            state.attachment = null;
            render();
            break;
          case "close-overlay":
            closeOverlay();
            break;
          case "history":
            state.pendingFocus = b;
            state.drawer = true;
            state.historyQuery = "";
            renderOverlay();
            focusOverlay();
            break;
          case "new-chat":
            newChat();
            break;
          case "open-chat":
            state.chatId = id;
            state.screen = "chat";
            state.draft = "";
            state.attachment = null;
            closeOverlay(false);
            render();
            break;
          case "delete-chat":
            if (state.stream?.chatId === id) stopStream();
            state.chats = state.chats.filter((c) => c.id !== id);
            if (state.chatId === id) state.chatId = null;
            render();
            break;
          case "suggest": {
            const s = [
              "Set a timer for 10 minutes",
              "Set an alarm for 7:00 AM",
              "Save a note",
              "Explain quantum computing simply",
            ];
            send(t(s[Number(b.dataset.index)]));
            break;
          }
          case "send":
            send();
            break;
          case "stop":
            stopStream();
            renderChatPreservingDraft();
            break;
          case "mic":
            toast("Listening… (simulated)");
            break;
          case "copy": {
            const m = findMessage(id);
            if (!m) break;
            try {
              if (navigator.clipboard?.writeText)
                await navigator.clipboard.writeText(m.text);
              else {
                const area = document.createElement("textarea");
                area.value = m.text;
                area.style.cssText = "position:fixed;opacity:0";
                document.body.appendChild(area);
                area.select();
                let copied;
                try {
                  copied = document.execCommand("copy");
                } finally {
                  area.remove();
                }
                if (!copied) throw Error("copy");
              }
              toast("Copied to clipboard");
            } catch (err) {
              toast("Copy unavailable. Select the message text to copy.", true);
            }
            break;
          }
          case "regenerate": {
            if (state.stream) break;
            const c = chat(),
              m = c?.messages.find((x) => x.id === id);
            if (!m) break;
            if (m.action?.status === "done") {
              toast(
                "This action already ran. Send a new request to repeat it.",
                true,
              );
              break;
            }
            const index = c.messages.indexOf(m);
            const u = c.messages
              .slice(0, index)
              .reverse()
              .find((x) => x.role === "user");
            if (u) startStream(c, makeAnswer(u.text, u.attachment), m);
            break;
          }
          case "confirm-action":
            executeAction(findMessage(id));
            render();
            break;
          case "cancel-action": {
            const m = findMessage(id);
            if (m?.action?.status === "pending") {
              m.action.status = "cancelled";
              toast("Action cancelled");
              render();
            }
            break;
          }
          case "delete-note":
            state.notes = state.notes.filter((n) => n.id !== id);
            persist();
            render();
            break;
          case "delete-fact":
            state.facts = state.facts.filter((n) => n.id !== id);
            persist();
            render();
            break;
          case "delete-timer":
            state.timers = state.timers.filter((n) => n.id !== id);
            render();
            break;
          case "delete-alarm":
            state.alarms = state.alarms.filter((n) => n.id !== id);
            render();
            break;
          case "new-note":
            openModal("note");
            break;
          case "add-fact":
            openModal("fact");
            break;
          case "save-text": {
            const text = document.getElementById("modal-text").value.trim();
            if (!text) {
              document.getElementById("modal-error").textContent = t(
                "What would you like to save?",
              );
              break;
            }
            const item = { id: uid(), text, created: Date.now() };
            if (state.modal.type === "fact") state.facts.push(item);
            else state.notes.unshift(item);
            persist();
            closeOverlay(false);
            render();
            toast("Saved");
            break;
          }
          case "tone":
            state.settings.tone = b.dataset.value;
            persist();
            b.parentElement.querySelectorAll("button").forEach((x) => {
              x.classList.toggle("chosen", x === b);
              x.setAttribute("aria-pressed", String(x === b));
            });
            break;
          case "toggle": {
            const key = b.dataset.key;
            if (key === "lock" && !state.settings.lock) {
              openModal("pin");
              break;
            }
            let value;
            if (key.startsWith("tool:")) {
              const tool = key.slice(5);
              value = state.settings.tools[tool] = !state.settings.tools[tool];
            } else {
              value = state.settings[key] = !state.settings[key];
              if (key === "lock") state.settings.pin = "";
            }
            persist();
            b.setAttribute("aria-checked", String(value));
            if (key === "lock") render();
            break;
          }
          case "save-pin": {
            const pin = document.getElementById("pin-setup").value;
            if (!/^\d{4}$/.test(pin)) {
              document.getElementById("pin-error").textContent = t(
                "PIN must be exactly 4 digits.",
              );
              break;
            }
            state.settings.pin = pin;
            state.settings.lock = true;
            persist();
            closeOverlay(false);
            render();
            toast("Saved");
            break;
          }
          case "lock-now":
            stopStream();
            state.locked = true;
            closeOverlay(false);
            clearTimeout(state.toastTimer);
            document.getElementById("toast").innerHTML = "";
            render();
            break;
          case "unlock":
            if (
              document.getElementById("unlock-pin").value === state.settings.pin
            ) {
              state.locked = false;
              render();
            } else
              document.getElementById("unlock-error").textContent = t(
                "Incorrect PIN. Try again.",
              );
            break;
          case "delete-all":
            openModal("delete-all");
            break;
          case "reset":
            resetAll();
            break;
          case "download-model":
            startDownload(id, b.dataset.variant);
            break;
          case "pause-download": {
            const d = state.downloads.find((d) => d.id === id);
            if (d) d.status = d.status === "paused" ? "running" : "paused";
            render();
            break;
          }
          case "cancel-download":
            state.downloads = state.downloads.filter((d) => d.id !== id);
            render();
            break;
          case "delete-model": {
            const m = state.models.find((m) => m.id === id);
            if (!m) break;
            if (state.stream) {
              toast("Stop the current reply before deleting a model.", true);
              break;
            }
            m.downloaded = false;
            state.downloads = state.downloads.filter((d) => d.modelId !== id);
            if (state.activeModel === id)
              state.activeModel =
                state.models.find((m) => m.downloaded && m.fit !== "large")
                  ?.id || null;
            persist();
            render();
            break;
          }
          case "select-model": {
            const m = state.models.find((m) => m.id === id);
            if (!m) break;
            if (m.fit === "large") {
              toast("Not enough RAM for this model", true);
              break;
            }
            if (state.stream) {
              toast("Wait for the current reply or stop it first.", true);
              break;
            }
            if (!m.downloaded) break;
            state.activeModel = id;
            persist();
            closeOverlay(false);
            state.screen = "chat";
            render();
            toast("Model selected");
            break;
          }
          case "open-repo":
            openRepo(Number(b.dataset.index));
            break;
        }
      });
      document.addEventListener("input", (e) => {
        const el = e.target;
        if (el.id === "message-input") {
          state.draft = el.value;
          resizeInput();
          const send = document.querySelector('[data-action="send"]');
          if (send) send.disabled = !el.value.trim();
        }
        if (el.id === "system-prompt") {
          state.settings.prompt = el.value;
          persist();
        }
        if (el.id === "history-search") {
          state.historyQuery = el.value;
          document.getElementById("history-items").innerHTML = historyItems();
        }
        if (el.id === "hf-search") state.hfQuery = el.value;
        if (el.id === "pin-setup" || el.id === "unlock-pin")
          el.value = el.value.replace(/\D/g, "");
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "language") {
          state.settings.language = e.target.value;
          persist();
          render();
        }
      });
      document.addEventListener("submit", (e) => {
        e.preventDefault();
        if (e.target.id === "search-form") {
          state.hfQuery = document.getElementById("hf-search").value;
          searchModels();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (
          e.key === "Enter" &&
          !e.shiftKey &&
          !e.isComposing &&
          e.target.id === "message-input"
        ) {
          e.preventDefault();
          send();
        }
        if (e.key === "Enter" && e.target.id === "unlock-pin")
          document.querySelector('[data-action="unlock"]').click();
        if (e.key === "Escape") closeOverlay();
        if (
          e.key === "Tab" &&
          document.getElementById("overlay").children.length
        ) {
          const nodes = [
            ...document.querySelectorAll(
              "#overlay button:not(:disabled),#overlay input,#overlay textarea,#overlay select",
            ),
          ];
          const first = nodes[0],
            last = nodes[nodes.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last?.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first?.focus();
          }
        }
      });
      document.getElementById("overlay").addEventListener("click", (e) => {
        if (e.target.id === "overlay") closeOverlay();
      });
      function resetAll() {
        stopStream();
        state.hfRequest++;
        state.fileRequest++;
        try {
          localStorage.removeItem("zoro.v1");
        } catch (e) {}
        Object.assign(state, {
          settings: defaults(),
          notes: [],
          facts: [],
          chats: [],
          timers: [],
          alarms: [],
          downloads: [],
          activeModel: null,
          models: baseModels.map((m) => ({
            ...m,
            quant: "Q4_K_M",
            downloaded: false,
          })),
          chatId: null,
          draft: "",
          attachment: null,
          screen: "chat",
          previous: "chat",
          hfQuery: "",
          hfSearched: false,
          hfLoading: false,
          repo: null,
          hfResults: [],
          hfError: false,
          files: [],
          filesLoading: false,
          filesError: false,
          locked: false,
          onboardDone: true,
        });
        closeOverlay(false);
        persist();
        render();
        toast("All local data deleted.");
      }
      // Hardware back in the Android shell closes an overlay before navigating home.
      window.zoroBack = () => {
        if (state.locked) return false;
        if (state.sheet || state.drawer || state.modal) {
          closeOverlay();
          return true;
        }
        if (state.screen !== "chat") {
          navigate(state.screen === "files" ? "hf" : "chat");
          return true;
        }
        return false;
      };
      // WebView/browser keyboards may resize only the visual viewport. Avoid a
      // fixed/minimum-height shell fighting that viewport or covering the footer.
      function syncViewport() {
        const height = window.visualViewport?.height || window.innerHeight;
        const editing = /^(INPUT|TEXTAREA)$/.test(
          document.activeElement?.tagName || "",
        );
        if (!editing && !state.keyboardOpen) state.viewportHeight = height;
        state.viewportHeight = Math.max(state.viewportHeight, height);
        state.keyboardOpen = editing && state.viewportHeight - height > 100;
        document.documentElement.style.setProperty("--vh", `${height}px`);
        document
          .getElementById("phone")
          .classList.toggle("keyboard-open", state.keyboardOpen);
        requestAnimationFrame(scrollChat);
      }
      window.visualViewport?.addEventListener("resize", syncViewport);
      window.addEventListener("resize", syncViewport);
      document.addEventListener("focusin", (e) => {
        if (e.target.id !== "message-input") return;
        syncViewport();
        const inputEl = e.target;
        setTimeout(() => {
          if (inputEl.isConnected && document.activeElement === inputEl) {
            inputEl.scrollIntoView({ block: "end" });
            scrollChat();
          }
        }, 300);
      });
      document.addEventListener("focusout", () =>
        setTimeout(syncViewport, 300),
      );
      syncViewport();
      load();
      render();
      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
